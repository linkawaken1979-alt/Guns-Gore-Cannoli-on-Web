
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity WebGL Player | Guns, Gore, and Cannoli</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">Guns, Gore, and Cannoli</div>
    </div>
  </div>

<script>
const container = document.querySelector("#unity-container");
const canvas = document.querySelector("#unity-canvas");
const loadingBar = document.querySelector("#unity-loading-bar");
const progressBarFull = document.querySelector("#unity-progress-bar-full");
const fullscreenButton = document.querySelector("#unity-fullscreen-button");
const warningBanner = document.querySelector("#unity-warning");

const buildUrl = "Build";
const CHUNK_SIZE = 20 * 1024 * 1024;

function unityShowBanner(msg, type) {
  const div = document.createElement("div");
  div.innerHTML = msg;

  if (type === "error") {
    div.style = "background:red;padding:10px;";
  } else {
    div.style = "background:yellow;padding:10px;";
    setTimeout(() => {
      div.remove();
      warningBanner.style.display =
        warningBanner.children.length ? "block" : "none";
    }, 5000);
  }

  warningBanner.appendChild(div);
  warningBanner.style.display = "block";
}

async function loadSplitFile(filename) {
  const chunks = [];
  let index = 0;
  let totalSize = 0;

  while (true) {
    const part = String(index).padStart(3, "0");
    const chunkName = filename + "." + part;

    console.log("Loading:", chunkName);

    const response = await fetch(buildUrl + "/" + chunkName);

    if (response.status === 404 && index > 0) {
      break;
    }

    if (!response.ok) {
      throw new Error("Failed to load " + chunkName + ": HTTP " + response.status);
    }

    const chunk = await response.arrayBuffer();

    if (chunk.byteLength === 0) {
      throw new Error("Empty chunk: " + chunkName);
    }

    chunks.push(chunk);
    totalSize += chunk.byteLength;

    console.log("Loaded:", chunkName, chunk.byteLength, "bytes");

    index++;

    if (chunk.byteLength < CHUNK_SIZE) {
      break;
    }
  }

  if (chunks.length === 0) {
    throw new Error("No chunks found for " + filename);
  }

  const combined = new Uint8Array(totalSize);
  let offset = 0;

  for (const chunk of chunks) {
    combined.set(new Uint8Array(chunk), offset);
    offset += chunk.byteLength;
  }

  console.log(
    filename + " complete:",
    totalSize,
    "bytes across",
    chunks.length,
    "chunks"
  );

  return combined.buffer;
}

async function startUnity() {
  loadingBar.style.display = "block";

  try {
    // Reassemble the split Unity files.
    const [dataBuffer, wasmBuffer] = await Promise.all([
      loadSplitFile("GunsGoreAndCannoliWeb.data"),
      loadSplitFile("GunsGoreAndCannoliWeb.wasm")
    ]);

    const dataBlob = new Blob(
      [dataBuffer],
      { type: "application/octet-stream" }
    );

    const wasmBlob = new Blob(
      [wasmBuffer],
      { type: "application/wasm" }
    );

    const config = {
      dataUrl: URL.createObjectURL(dataBlob),
      frameworkUrl: buildUrl + "/GunsGoreAndCannoliWeb.framework.js",
      codeUrl: URL.createObjectURL(wasmBlob),
      symbolsUrl: buildUrl + "/GunsGoreAndCannoliWeb.symbols.json",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Crazy Monkey Studios",
      productName: "Guns, Gore, and Cannoli",
      productVersion: "StandaloneWindows_1.2.21",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);

      container.className = "unity-mobile";
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

    const script = document.createElement("script");
    script.src = buildUrl + "/GunsGoreAndCannoliWeb.loader.js";

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (progress * 100) + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";

        fullscreenButton.onclick = () => {
          unityInstance.SetFullscreen(1);
        };

        window.unityInstance = unityInstance;
        console.log("Unity loaded successfully!");

      }).catch((error) => {
        console.error("Unity startup error:", error);
        unityShowBanner(String(error), "error");
      });
    };

    script.onerror = () => {
      unityShowBanner("Failed to load Unity loader.", "error");
    };

    document.body.appendChild(script);

  } catch (error) {
    console.error("File loading error:", error);
    unityShowBanner("Loading error: " + error.message, "error");
  }
}

startUnity();
</script>
</body>
</html>
